<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>LUMA Camera</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#f5f2ea;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 16px 32px}header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px}.logo{font-size:30px;letter-spacing:7px;font-weight:650}.sub{font-size:10px;color:#aaa;letter-spacing:2px;margin-top:4px}.badge{font-size:10px;border:1px solid #554d3e;color:#d5c39e;border-radius:20px;padding:8px}#preview,.result{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px;background:#252525;display:block}.result{margin-top:14px;height:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button,.file{border:0;border-radius:13px;padding:15px 8px;background:#eeeae0;color:#171717;font-size:14px;font-weight:650;text-align:center;display:flex;justify-content:center;align-items:center;min-height:48px}.dark{background:#292929;color:white}input[type=file]{display:none}.panel{background:#1c1c1c;border-radius:16px;padding:17px;margin-top:14px}h3{font-size:11px;letter-spacing:2px;color:#aaa;margin:0 0 15px}select{width:100%;padding:13px;background:#292929;color:#fff;border:1px solid #383838;border-radius:10px;font-size:15px}.adjust{display:block;font-size:13px;margin:18px 0}.adjust span{float:right;color:#d5c39e}input[type=range]{width:100%;display:block;margin-top:12px;accent-color:#d5c39e}.status{font-size:12px;color:#d5c39e;min-height:18px;margin:12px 2px}.note{font-size:11px;color:#888;line-height:1.7;margin-top:16px}footer{text-align:center;color:#777;font-size:10px;letter-spacing:2px;margin:28px 0}</style></head><body>
<header><div><div class="logo">LUMA</div><div class="sub">MOMENTS IN LIGHT</div></div><div class="badge">CAMERA STUDIO</div></header>
<video id="preview" autoplay playsinline muted></video><div class="status" id="status">準備就緒 · 開啟相機或匯入照片</div>
<div class="actions"><button id="start">開啟相機</button><button id="shoot">拍照</button><label class="file dark" for="upload">匯入照片</label><input id="upload" type="file" accept="image/*"><button id="save" class="dark">儲存照片</button><button id="reset" class="dark">重設調色</button></div>
<img id="result" class="result" alt="LUMA 編輯結果" hidden><canvas id="canvas" hidden></canvas>
<div class="panel"><h3>LOOKS / 濾鏡</h3><select id="preset"><option value="natural">Natural · 自然</option><option value="soft">Soft Light · 柔光</option><option value="warm">Warm Film · 暖色底片</option><option value="mono">Mono · 黑白</option></select></div>
<div class="panel"><h3>LIGHT / 光影調色</h3><label class="adjust">曝光 Exposure <span id="exposureValue">0</span><input id="exposure" type="range" min="-100" max="100" value="0"></label><label class="adjust">對比 Contrast <span id="contrastValue">0</span><input id="contrast" type="range" min="-100" max="100" value="0"></label><label class="adjust">飽和 Saturation <span id="saturationValue">0</span><input id="saturation" type="range" min="-100" max="100" value="0"></label><label class="adjust">暖色 Warmth <span id="warmthValue">0</span><input id="warmth" type="range" min="-100" max="100" value="0"></label></div>
<p class="note">請使用 HTTPS 網址在 Safari 開啟。首次使用相機時，請允許相機權限。拍照或匯入照片後，可套用濾鏡、調整光影並儲存編輯結果。</p><footer>LUMA · FIND YOUR LIGHT</footer>
<script>(()=>{const video=document.querySelector('#preview'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),result=document.querySelector('#result'),status=document.querySelector('#status');let stream=null,source=null,ready=false;const ids=['exposure','contrast','saturation','warmth'];const say=t=>status.textContent=t;async function start(){try{if(!navigator.mediaDevices?.getUserMedia){say('請透過 HTTPS 網址在 Safari 開啟相機功能。');return}if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();source=video;ready=false;result.hidden=true;video.hidden=false;say('相機已開啟，可以拍照。')}catch(e){say('無法開啟相機，請在 Safari 設定中允許此網站使用相機。')}}function filter(){const v=id=>Number(document.getElementById(id).value);ids.forEach(id=>document.getElementById(id+'Value').textContent=(v(id)>0?'+':'')+v(id));let b=100+v('exposure')*.65,c=100+v('contrast'),s=Math.max(0,100+v('saturation')),sep=Math.max(0,v('warmth'))*.004,g=0;const p=document.querySelector('#preset').value;if(v('warmth')<0)s=Math.max(0,s+v('warmth')*.2);if(p==='soft'){b+=7;c*=.88;s*=.9}if(p==='warm'){sep=Math.min(.8,sep+.25);s*=1.08;b+=2}if(p==='mono')g=1;return `brightness(${Math.max(0,b)}%) contrast(${Math.max(0,c)}%) saturate(${g?0:s}%) sepia(${sep}) grayscale(${g})`}function render(){if(!source)return;const w=source.videoWidth||source.naturalWidth,h=source.videoHeight||source.naturalHeight;if(!w||!h){say('照片尚未準備好，請稍候。');return}const scale=Math.min(1,2400/Math.max(w,h));canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);ctx.save();ctx.filter=filter();ctx.drawImage(source,0,0,canvas.width,canvas.height);ctx.restore();result.src=canvas.toDataURL('image/jpeg',.92);result.hidden=false;ready=true}document.querySelector('#start').onclick=start;document.querySelector('#shoot').onclick=()=>{if(!stream||video.readyState<2){say('請先開啟相機並允許相機權限。');return}source=video;render();if(ready)say('拍照完成！可以調色或儲存。')};document.querySelector('#upload').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){say('請選擇圖片檔案。');return}const img=new Image();img.onload=()=>{source=img;video.hidden=true;render();say('照片已匯入，可以開始調色。');URL.revokeObjectURL(img.src)};img.onerror=()=>say('無法讀取照片，請再試一次。');img.src=URL.createObjectURL(f)};ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(source)render()}));document.querySelector('#preset').onchange=()=>{if(source)render()};document.querySelector('#reset').onclick=()=>{ids.forEach(id=>document.getElementById(id).value=0);document.querySelector('#preset').value='natural';if(source)render();say('調色已重設。')};document.querySelector('#save').onclick=()=>{if(!source||!ready){say('請先拍照或匯入照片。');return}render();canvas.toBlob(blob=>{if(!blob){say('儲存失敗，請再試一次。');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LUMA-'+Date.now()+'.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);say('照片已匯出；如出現分享選單，可選儲存影像或存到檔案。')},'image/jpeg',.92)};window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())})})();</script></body></html>
